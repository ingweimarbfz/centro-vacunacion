<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f2"/><stop offset="1" stop-color="#eef6fa"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc9e0"/><stop offset="1" stop-color="#5f9fc0"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe8ee"/></linearGradient>
    <pattern id="win" width="56" height="48" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="40" height="30" rx="3" fill="url(#glass)"/></pattern>
    <pattern id="win2" width="44" height="40" patternUnits="userSpaceOnUse"><rect x="6" y="6" width="32" height="24" rx="3" fill="url(#glass)"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="980" cy="160" r="90" fill="#ffffff" opacity=".6"/>
  <!-- edificio principal -->
  <rect x="300" y="250" width="560" height="560" fill="url(#wall)"/>
  <rect x="320" y="300" width="520" height="430" fill="url(#win)"/>
  <rect x="300" y="230" width="560" height="28" fill="#c9d7e1"/>
  <!-- letrero con cruz -->
  <rect x="520" y="140" width="120" height="120" rx="18" fill="#ffffff" stroke="#c9d7e1" stroke-width="6"/>
  <rect x="567" y="160" width="26" height="80" rx="4" fill="#2f86b8"/>
  <rect x="540" y="187" width="80" height="26" rx="4" fill="#2f86b8"/>
  <!-- alas laterales -->
  <rect x="90" y="420" width="230" height="390" fill="url(#wall)"/>
  <rect x="105" y="450" width="200" height="300" fill="url(#win2)"/>
  <rect x="840" y="380" width="270" height="430" fill="url(#wall)"/>
  <rect x="855" y="410" width="240" height="340" fill="url(#win2)"/>
  <!-- entrada -->
  <rect x="500" y="690" width="160" height="120" fill="#7fb3cf"/>
  <rect x="470" y="660" width="220" height="36" rx="6" fill="#2f86b8"/>
  <!-- piso y vegetación -->
  <rect x="0" y="810" width="1200" height="90" fill="#cfd9df"/>
  <rect x="0" y="800" width="1200" height="14" fill="#b9c6ce"/>
  <circle cx="60" cy="770" r="55" fill="#7fb69a"/><circle cx="250" cy="785" r="40" fill="#8fc2a8"/>
  <circle cx="930" cy="780" r="45" fill="#8fc2a8"/><circle cx="1140" cy="765" r="60" fill="#7fb69a"/>
  <!-- ambulancia -->
  <g transform="translate(700 742)">
    <rect x="0" y="10" width="150" height="56" rx="8" fill="#ffffff" stroke="#9fb2bf" stroke-width="3"/>
    <path d="M150 26 h28 l22 22 v18 h-50 z" fill="#ffffff" stroke="#9fb2bf" stroke-width="3"/>
    <rect x="12" y="34" width="130" height="8" fill="#2f86b8"/>
    <rect x="60" y="14" width="10" height="26" fill="#2f86b8"/><rect x="52" y="22" width="26" height="10" fill="#2f86b8"/>
    <circle cx="36" cy="68" r="12" fill="#3d4b55"/><circle cx="168" cy="68" r="12" fill="#3d4b55"/>
  </g>
</svg>
